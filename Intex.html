<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #667eea;
            margin-top: 25px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            border-bottom: 1px solid #eee;
            padding: 8px;
        }

        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Huỳnh Lê Tâm Hiếu</h1>

        <div class="info">
            <p><strong>Lớp:</strong> CO24A</p>
            <p><strong>Ngành:</strong> Kỹ thuật máy tính</p>
        </div>

        <h2>Sở thích</h2>

        <span class="tag">🎵 Nghe nhạc</span>

    </div>

</body>
              </html>
